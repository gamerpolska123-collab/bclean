version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: bartekclean-web
    ports:
      - "5959:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - bartekclean-net

networks:
  bartekclean-net:
    driver: bridge
